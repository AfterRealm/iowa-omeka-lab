# Nginx config for Omeka S 4.1.1 — proxies PHP to the omeka-fpm container.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    client_max_body_size 64M;

    # CORS for the Iowa Letters static demo site (Netlify origin, localhost
    # during local dev, and ngrok-tunnelled iowa-letters preview origins).
    # Permissive on purpose: the API has its own auth layer (key_identity +
    # key_credential), and the only writable role behind any public-facing
    # key (iowa-letters-author) is bounded to creating new items.
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?|iowa-letters\.netlify\.app|.*\.netlify\.app|.*\.ngrok\.dev|.*\.ngrok-free\.app)$") {
        set $cors_origin $http_origin;
    }

    location /api/ {
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, ngrok-skip-browser-warning" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Vary                         "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        try_files $uri $uri/ /index.php?$args;
    }

    # Files directory has no executable PHP — deny direct PHP access there
    location /files/ {
        location ~ \.php$ { return 403; }
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass omeka-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120s;

        # CORS — repeated here because nginx clears add_header when it routes
        # to a different location block. The /api/ location handles preflight
        # OPTIONS but the actual POST/GET response comes through here once
        # nginx rewrites to /index.php.
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, ngrok-skip-browser-warning" always;
        add_header Vary                         "Origin" always;
    }

    # Protect sensitive paths
    location ~* /\.ht        { deny all; }
    location ~* /config/     { deny all; }
    location ~* /application/data/  { deny all; }
}
